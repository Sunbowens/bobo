name: 每日 GitHub 热门项目

# 每天 UTC 01:00 (北京时间 09:00) 自动抓取，并把报告归档到 reports/。
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "时间范围"
        default: "daily"
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取热门项目并归档
        env:
          SINCE: ${{ github.event.inputs.since || 'daily' }}
        run: |
          DATE=$(date -u +%F)
          mkdir -p reports
          python3 trending.py --since "$SINCE" --format markdown \
            --output "reports/${DATE}.md"
          # 同时更新仓库首页展示的最新榜单
          python3 trending.py --since "$SINCE" --format markdown \
            --output "reports/latest.md"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交。"
          else
            git commit -m "chore: 更新 $(date -u +%F) GitHub 热门项目榜单"
            git push
          fi
